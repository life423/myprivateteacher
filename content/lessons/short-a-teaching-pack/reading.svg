<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700" role="img" aria-labelledby="title desc" data-min-target-font-size="128"><title id="title">Pat</title><desc id="desc">Read. Then read again.</desc><defs><clipPath id="mouth"><rect x="136" y="1130" width="336" height="380" rx="22"/></clipPath></defs><rect width="1600" height="1700" fill="white"/><rect x="28" y="28" width="1544" height="1644" rx="34" fill="white" stroke="#dce3ec" stroke-width="3"/><g font-family="Arial, Helvetica, sans-serif" fill="#182134"><text x="104" y="113" font-size="30" font-weight="700" letter-spacing="3">MY PRIVATE TEACHER</text><circle cx="1450" cy="101" r="24" fill="#f4b544"/><text x="1450" y="112" font-size="27" text-anchor="middle" font-weight="700">3</text><path d="M104 158H1496" stroke="#dce3ec" stroke-width="2"/><path d="M104 158H224" stroke="#6d35d5" stroke-width="7"/><text x="104" y="273" font-size="84" font-weight="700" letter-spacing="-2">Pat</text><text x="108" y="346" font-size="42" fill="#526277">Read. Then read again.</text><text x="151" y="565" font-size="128" data-target="passage-line">Pat sat.</text><text x="151" y="823" font-size="128" data-target="passage-line">Tap, Pat, tap!</text><text x="151" y="1081" font-size="128" data-target="passage-line">Pat sat.</text><text x="151" y="1339" font-size="128" data-target="passage-line">Tap, tap, tap!</text><path d="M104 1588H1496" stroke="#dce3ec" stroke-width="2"/><text x="104" y="1641" font-size="30" fill="#526277" font-weight="700" letter-spacing="2">SHORT A</text><text x="1496" y="1641" font-size="28" text-anchor="end" fill="#526277">Read with ordinary print.</text></g></svg>
