<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700" role="img" aria-labelledby="title description">
  <title id="title">Sam and Pat</title>
  <desc id="description">Sam sat. Pat sat. Tap, Sam, tap! Tap, Pat, tap!</desc>
  <rect width="1600" height="1700" fill="white"/>
  <rect x="32" y="32" width="1536" height="1636" rx="44" fill="none" stroke="#e2e8f0" stroke-width="4"/>
  <g fill="#182134" font-family="Arial, Helvetica, sans-serif" font-size="124" font-weight="400" letter-spacing="1">
    <text x="150" y="410">Sam sat.</text>
    <text x="150" y="680">Pat sat.</text>
    <text x="150" y="1010">Tap, Sam, tap!</text>
    <text x="150" y="1280">Tap, Pat, tap!</text>
  </g>
</svg>
